<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>AIdventure</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Password overlay -->
  <div id="auth-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h1>AIdventure</h1>
      <p>Enter password to connect</p>
      <input type="password" id="auth-input" placeholder="Password" autocomplete="off">
      <button id="auth-btn">Enter</button>
    </div>
  </div>

  <!-- Connection overlay -->
  <div id="connect-overlay" class="overlay">
    <div class="overlay-content">
      <h1>AIdventure</h1>
      <p id="connect-status">Connecting...</p>
      <button id="reconnect-btn" class="hidden">Reconnect</button>
    </div>
  </div>

  <!-- Main game UI -->
  <div id="game" class="hidden">

    <!-- Status bar + New Story button -->
    <div id="top-bar">
      <header id="status-bar"></header>
      <button id="settings-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
      <button id="new-story-btn" class="hidden" title="Start a new story">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        New Story
      </button>
    </div>

    <!-- Narrative area -->
    <main id="narrative-area">
      <div id="narrative-content"></div>
    </main>

    <!-- Menu (genre selection) -->
    <div id="menu-area" class="hidden"></div>

    <!-- Input area -->
    <footer id="input-area">
      <div id="thinking-indicator" class="hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div id="input-controls">
        <input type="text" id="text-input" placeholder="Type your action..." autocomplete="off">
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <div id="settings-modal" class="overlay hidden" aria-hidden="true">
    <div class="settings-panel" role="dialog" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <label class="settings-label" for="tts-voice-select">Narration voice</label>
      <p class="settings-desc">OpenAI TTS voice for <strong>Narrate</strong> and for newly generated scene audio.</p>
      <select id="tts-voice-select" autocomplete="off"></select>
      <button type="button" id="settings-close" class="settings-done">Done</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
